name: secure_qr
description: "SecureQR: Intelligent QR Threat Detection & Payment Safety Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.0.0
  image_picker: ^1.2.1
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  google_fonts: ^6.2.1
  provider: ^6.1.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  percent_indicator: ^4.2.4
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
